name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Đẩy tiếp lên cùng một branch thì lần chạy trước không còn ý nghĩa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tách hai job có chủ ý: chúng chạy song song, và "lint hỏng" với "game hỏng" là
  # hai tin khác nhau, không nên xếp hàng chờ nhau.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # Gồm cả rule chặn Math.random / Date.now / DOM trong src/game/core —
        # bất biến #1. Đây là chỗ duy nhất nó được kiểm tự động.
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      # KHÔNG có bước audit nào ở đây, có chủ ý. Lý do gốc: endpoint audit của
      # yarn 1 trả về một summary rỗng (0 dependency, 0 devDependency) kèm exit
      # code 0, nên bất kỳ gate dựng trên nó cũng xanh vĩnh viễn — một cổng bảo
      # mật không bao giờ đỏ được thì tệ hơn không có cổng, vì người ta tin nó.
      # Sang pnpm thì `pnpm audit` đọc đúng advisory database và CÓ THỂ đỏ thật
      # (xem scripts/check-audit.mjs, chạy ở máy bằng `pnpm check:audit`), nhưng
      # cổng chặn trong CI vẫn là `dependency-review` bên dưới: nó đọc advisory
      # của GitHub, không phụ thuộc endpoint của registry nào.

  # NFR-SEC-02, đọc từ advisory database của GitHub thay vì endpoint của registry.
  # Chỉ chạy trên pull request được: action này so sánh cây phụ thuộc của base với
  # của head, nên nó cần hai đầu để so.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the static export
        run: pnpm build

      # NFR-PERF-04, đo từ HTML đã export chứ không đọc bảng của `next build`:
      # thứ `out/index.html` tham chiếu chính là thứ trình duyệt tải về. Gate dựng
      # trên bảng in ra sẽ vỡ mỗi lần Next đổi định dạng, gate này chỉ vỡ khi
      # bundle thật sự phình.
      - name: First-load JS budget
        run: node scripts/check-bundle-size.mjs out

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Chạy trên out/ qua scripts/serve.mjs — đúng thứ GitHub Pages sẽ phục vụ —
      # ở 375 / 768 / 1024 / 1440 và trên một điện thoại cảm ứng.
      - name: End-to-end tests
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
