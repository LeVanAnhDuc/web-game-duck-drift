name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Mỗi lần một deploy, và không bao giờ huỷ giữa chừng: một deploy bị cắt ngang có
# thể để site phục vụ một artifact mới upload được một nửa.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint chay o day chu khong chi trong ci.yml: `build` bat duoc loi kieu
      # nhung khong bat vi pham lint, va mot push thang vao `main` khong di
      # qua pull request.
      - run: pnpm lint

      # Test chạy lại ở đây thay vì tin vào workflow CI: hai workflow này độc lập,
      # và một deploy giả định rằng có một lần chạy xanh mà nó không nhìn thấy là
      # một deploy sớm muộn sẽ đẩy bản đỏ lên.
      - run: pnpm test

      - run: pnpm build
        env:
          # Chỉ đặt ở đây. Nó bật basePath cho đường dẫn con /web-game-duck-drift;
          # `pnpm dev` và build ở máy vẫn chạy ở gốc.
          GITHUB_PAGES: 'true'

      # KHÔNG dùng `enablement: true`: đã thử và nó đỏ với "Resource not
      # accessible by integration". `GITHUB_TOKEN` có `pages: write` nên deploy
      # được, nhưng TẠO Pages site cần quyền admin repo mà nó không có. Việc bật
      # Pages vì vậy là một bước một-lần ở ngoài workflow — xem ADR-0008.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
